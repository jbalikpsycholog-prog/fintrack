<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinTrack OSVČ{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Horní lišta -->
  <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
      <a href="/" class="font-bold text-blue-700 text-lg tracking-tight">💼 FinTrack OSVČ</a>
      <div class="flex gap-1 text-sm">
        <a href="/" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Dashboard</a>
        <a href="/import" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Import</a>
        <a href="/transactions/new" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Nová transakce</a>
        <a href="/transactions" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Transakce</a>
        <a href="/reports" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Sestavy</a>
        <a href="/money" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Peníze</a>
        <a href="/categories" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition">Kategorie</a>
      </div>
      {% if available_years %}
      <form method="get" action="/set-year" class="flex items-center">
        <input type="hidden" name="next" value="{{ current_path or '/' }}">
        <select name="year" onchange="this.form.submit()" title="Aktivní rok"
                class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm font-medium bg-white text-gray-700 hover:border-gray-400 cursor-pointer">
          {% for y in available_years %}
          <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </form>
      {% endif %}
    </div>
  </nav>

  <!-- Obsah stránky -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
